name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi dan pasang platform SDK 37 (Android SDK sudah ada di runner)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" || echo "Platform 37 tidak terpasang manual, Gradle akan mengunduh sendiri"

      - name: Siapkan kunci tanda tangan tetap
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f signing/debug.keystore
            git commit -m "Tambah kunci tanda tangan tetap"
            git push
          fi
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Terapkan patch pending-*.patch (jika ada)
        id: patch
        run: |
          shopt -s nullglob
          PATCHES=(pending-*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "Tidak ada patch, build seperti biasa."
            exit 0
          fi
          TOTAL=0
          for f in "${PATCHES[@]}"; do
            LAST=$(tail -n 1 "$f")
            PARTS=$(echo "$LAST" | sed -n 's/^# FIN part=[0-9]*\/\([0-9][0-9]*\) files=[0-9][0-9]*$/\1/p')
            EXPECT=$(echo "$LAST" | sed -n 's/^# FIN part=[0-9]*\/[0-9]* files=\([0-9][0-9]*\)$/\1/p')
            ACTUAL=$(grep -c '^diff --git ' "$f" || true)
            echo "Memeriksa $f ($(wc -c < "$f") byte, $ACTUAL file)"
            if [ -z "$EXPECT" ] || [ "$EXPECT" != "$ACTUAL" ]; then
              echo "::error::$f terpotong atau rusak saat diupload (penanda akhir tidak ditemukan). Upload ulang file aslinya."
              exit 1
            fi
            if [ "$PARTS" != "${#PATCHES[@]}" ]; then
              echo "::error::Ada ${#PATCHES[@]} file pending-*.patch di repo, seharusnya $PARTS. Upload semua bagian sekaligus."
              exit 1
            fi
            TOTAL=$((TOTAL + ACTUAL))
          done
          for f in "${PATCHES[@]}"; do
            echo "Menerapkan $f ..."
            if ! git apply --index --whitespace=nowarn "$f"; then
              echo "::error::Gagal menerapkan $f."
              exit 1
            fi
          done
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" != "$TOTAL" ]; then
            echo "::error::Jumlah file berubah ($CHANGED) tidak sama dengan isi patch ($TOTAL)."
            exit 1
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Pasang Gradle dan cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Siapkan file APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/MyLauncher-build${{ github.run_number }}.apk"
          ls -lh dist

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-build${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Buat Release agar APK bisa diunduh langsung dari HP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.apk
          prerelease: true

      - name: Simpan perubahan patch ke repo (hanya jika build lolos)
        if: steps.patch.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files 'pending*.patch' | xargs -r git rm -q -f
          git commit -m "Terapkan patch (build lolos)"
          git push
