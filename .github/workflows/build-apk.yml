name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang platform SDK 37 (compileSdk proyek ini)
        run: sdkmanager "platforms;android-37" || echo "Dilewati, Gradle akan mengunduh sendiri jika perlu"

      - name: Siapkan kunci tanda tangan tetap
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f signing/debug.keystore
            git commit -m "Tambah kunci tanda tangan tetap"
            git push
          fi
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Pasang Gradle dan cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Siapkan file APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/MyLauncher-build${{ github.run_number }}.apk"
          ls -lh dist

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-build${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Buat Release agar APK bisa diunduh langsung dari HP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.apk
          prerelease: true
